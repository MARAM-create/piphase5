spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
application.url-frontend=${FRONTEND_URL}
app.base-url=${APP_BASE_URL}
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER}
stripe.api.key=${STRIPE_KEY}
stripe.secret.key=${STRIPE_KEY}
stripe.key=${STRIPE_KEY}
gemini.api.key=${GEMINI_API_KEY}
application.jwt.secret=${JWT_SECRET}
application.jwt.expiration=86400000
application.recaptcha.cle-secrete=${RECAPTCHA_SECRET}
application.recaptcha.url-verification=https://www.google.com/recaptcha/api/siteverify
application.google.client-id=${GOOGLE_CLIENT_ID}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.default-encoding=UTF-8
app.upload.video-dir=uploads/videos
app.upload.visite3d-dir=uploads/visites3d
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
pdf.keystore.path=classpath:locavia-keystore.p12
pdf.keystore.password=locavia2025
pdf.keystore.alias=locavia
logging.level.com.PiCloud.locavia=INFO
logging.level.root=WARN